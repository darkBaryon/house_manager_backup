server:
  port: 8080
  mode: release

mongodb:
  addrs:
    - "127.0.0.1:27018"
  database: "house_manager_test"
  auth_source: "admin"
  username: ""
  password: ""
  pool_size: 50
  min_pool_size: 5
  connect_timeout: "10s"
  socket_timeout: "30s"
  server_selection_timeout: "10s"
  retry_reads: true
  retry_writes: true
  replica_set: ""

redis:
  addrs:
    - "127.0.0.1:6380"
  password: ""
  db: 1
  pool_size: 50
  min_idle_conns: 5
  conn_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3
  cluster_mode: false

wechat:
  appid: ""
  secret: ""
  api_base: "https://api.weixin.qq.com"

log:
  level: "info"
  format: "json"
  add_source: false
  service: "house-manager"
  env: "test"
