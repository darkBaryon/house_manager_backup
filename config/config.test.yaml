server:
  port: 8080
  mode: release

mongodb:
  addrs:
    - "127.0.0.1:27018"
  database: "house_manager_test"
  auth_source: "admin"
  username: ""
  password: ""
  pool_size: 50
  min_pool_size: 5
  connect_timeout: "10s"
  socket_timeout: "30s"
  server_selection_timeout: "10s"
  retry_reads: true
  retry_writes: true
  replica_set: ""

redis:
  addrs:
    - "127.0.0.1:6380"
  password: ""
  db: 1
  pool_size: 50
  min_idle_conns: 5
  conn_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3
  cluster_mode: false

wechat:
  appid: ""
  secret: ""
  api_base: "https://api.weixin.qq.com"

auth:
  session_ttl: "168h"

ai_chat:
  python_base_url: "http://127.0.0.1:8000"
  internal_token: "test-internal-token"
  respond_timeout: "120s"
  tool_timeout: "5s"
  session_idle_timeout: "30m"
  recent_message_limit: 20
  runtime_context_ttl: "24h"

log:
  level: "info"
  format: "json"
  add_source: true
  service: "house-manager"
  env: "test"
