server:
  port: 8080
  mode: debug

mongodb:
  addrs:
    - "127.0.0.1:27018"
  database: "rent-house"
  auth_source: "rent-house"
  username: ""
  password: ""
  pool_size: 100
  min_pool_size: 10
  connect_timeout: "10s"
  socket_timeout: "30s"
  server_selection_timeout: "10s"
  retry_reads: true
  retry_writes: true
  replica_set: ""

redis:
  addrs:
    - "127.0.0.1:6380"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  conn_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3
  cluster_mode: false

wechat:
  appid: ""
  secret: ""
  api_base: "https://api.weixin.qq.com"

log:
  level: "info"
  format: "text"
  add_source: true
  service: "house-manager"
  env: "local"
